server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: contentpilot-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/contentpilot}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  # Public HTTPS/HTTP origin that reaches this backend from the internet (or LAN).
  # Used to convert relative /uploads/... media links into absolute URLs for Telegram.
  public-base-url: ${PUBLIC_BASE_URL:}
  jwt:
    secret: ${JWT_SECRET:contentpilot-hackathon-super-secret-key-32bytes-min-len}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  ai:
    text-provider: ${AI_TEXT_PROVIDER:auto}
    text-model: ${AI_TEXT_MODEL:gemini-2.5-flash}
    gemini-api-key: ${GEMINI_API_KEY:}
    claude-api-key: ${CLAUDE_API_KEY:}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    ollama-model: ${OLLAMA_MODEL:llama3.2}
    image-provider: ${AI_IMAGE_PROVIDER:fallback}
    comfyui-base-url: ${COMFYUI_BASE_URL:http://comfyui:8188}
    video-provider: ${AI_VIDEO_PROVIDER:ffmpeg-motion}
  claude:
    api-key: ${CLAUDE_API_KEY:}
  openai:
    api-key: ${OPENAI_API_KEY:}
  creative:
    storage-dir: ${CREATIVE_STORAGE_DIR:./uploads/creative}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
  account:
    # Show the password-reset token directly in the response instead of e-mail
    # delivery (there is no SMTP integration yet). NEVER enable in production.
    reveal-reset-token: ${ACCOUNT_REVEAL_RESET_TOKEN:false}
    reset-token-ttl-minutes: ${ACCOUNT_RESET_TOKEN_TTL_MINUTES:30}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
